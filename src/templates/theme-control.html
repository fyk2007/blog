<details class="theme-control">
  <summary class="theme-trigger" aria-label="配色：蓝白"><span class="theme-current" aria-hidden="true"></span><span>配色</span><span class="theme-chevron" aria-hidden="true">⌄</span></summary>
  <div class="theme-panel" role="radiogroup" aria-label="界面配色">
    <button class="theme-option" type="button" role="radio" data-theme-value="blue" aria-label="蓝白" aria-checked="true" tabindex="0"><span class="theme-swatch" aria-hidden="true"></span><span>蓝白</span><span class="theme-check" aria-hidden="true">✓</span></button>
    <button class="theme-option" type="button" role="radio" data-theme-value="sage" aria-label="苔绿" aria-checked="false" tabindex="-1"><span class="theme-swatch" aria-hidden="true"></span><span>苔绿</span><span class="theme-check" aria-hidden="true">✓</span></button>
    <button class="theme-option" type="button" role="radio" data-theme-value="sand" aria-label="暖砂" aria-checked="false" tabindex="-1"><span class="theme-swatch" aria-hidden="true"></span><span>暖砂</span><span class="theme-check" aria-hidden="true">✓</span></button>
    <button class="theme-option" type="button" role="radio" data-theme-value="lavender" aria-label="雾紫" aria-checked="false" tabindex="-1"><span class="theme-swatch" aria-hidden="true"></span><span>雾紫</span><span class="theme-check" aria-hidden="true">✓</span></button>
    <button class="theme-option" type="button" role="radio" data-theme-value="rose" aria-label="灰粉" aria-checked="false" tabindex="-1"><span class="theme-swatch" aria-hidden="true"></span><span>灰粉</span><span class="theme-check" aria-hidden="true">✓</span></button>
    <button class="theme-option" type="button" role="radio" data-theme-value="teal" aria-label="青灰" aria-checked="false" tabindex="-1"><span class="theme-swatch" aria-hidden="true"></span><span>青灰</span><span class="theme-check" aria-hidden="true">✓</span></button>
    <button class="theme-option" type="button" role="radio" data-theme-value="graphite" aria-label="石墨" aria-checked="false" tabindex="-1"><span class="theme-swatch" aria-hidden="true"></span><span>石墨</span><span class="theme-check" aria-hidden="true">✓</span></button>
    <button class="theme-option" type="button" role="radio" data-theme-value="olive" aria-label="浅橄榄" aria-checked="false" tabindex="-1"><span class="theme-swatch" aria-hidden="true"></span><span>浅橄榄</span><span class="theme-check" aria-hidden="true">✓</span></button>
  </div>
</details>
